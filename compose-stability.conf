// Types the Compose compiler cannot prove stable but that never change after creation.
// Marking them stable lets a list card skip recomposition when its item is equal().

// Read-only Kotlin collections: every model here builds them once and never mutates them
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

// Domain models are immutable data classes (only val properties)
com.nexus.feature.feed.domain.model.*
com.nexus.feature.post.domain.model.*
com.nexus.feature.auth.domain.model.*
