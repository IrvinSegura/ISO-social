name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches dependencies and the wrapper distribution between runs
      - uses: gradle/actions/setup-gradle@v4

      # API keys live in local.properties, which is not committed: the build uses empty
      # values (Giphy and Spotify are disabled) and everything else still compiles and runs
      - name: Build and unit tests
        run: ./gradlew assembleDebug testDebugUnitTest -PversionCode=${{ github.run_number }} --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
